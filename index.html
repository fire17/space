<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05061a">
<title>חללית · טסים בין כוכבים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#05061a;--ink:#f2f3ff;--muted:#a9acd6;--gold:#ffd23f;--cyan:#5ee7ff;--pink:#ff6ec7}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;overflow:hidden;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;pointer-events:none}
  .title{font-size:22px;font-weight:900}
  .title span{color:var(--cyan)}
  .stats{display:flex;gap:8px}
  .pill{background:#ffffff14;border:1px solid #ffffff2a;border-radius:14px;padding:6px 10px;font-weight:700;font-size:15px;backdrop-filter:blur(6px)}
  .card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05061acc;backdrop-filter:blur(4px);z-index:5}
  .card.hide{display:none}
  .box{width:min(88%,380px);text-align:center;padding:24px 20px;border-radius:24px;background:linear-gradient(160deg,#1b1d4a,#0b0c2a);border:2px solid var(--cyan);box-shadow:0 20px 60px #000a,0 0 40px #5ee7ff33}
  .box h2{font-size:28px;margin-bottom:8px}
  .box p{font-size:16px;line-height:1.6;color:#dfe2ff;margin-bottom:6px}
  .box .big{font-size:56px;margin-bottom:6px}
  button{font-family:inherit;font-size:19px;font-weight:800;border:0;border-radius:16px;padding:13px 26px;margin-top:12px;background:linear-gradient(135deg,var(--cyan),#8b7bff);color:#07081f;box-shadow:0 8px 24px #5ee7ff55;cursor:pointer}
  button:active{transform:scale(.96)}
  .fact{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(92%,460px);background:#ffffff16;border:1px solid #ffffff30;border-radius:16px;padding:10px 14px;font-size:15px;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(6px)}
  .fact.show{opacity:1}
  .ver{position:fixed;bottom:2px;left:8px;font-size:10px;color:var(--muted);opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="title">🚀 <span>חללית</span></div>
  <div class="stats">
    <div class="pill" id="pPlanets">🪐 0/8</div>
    <div class="pill" id="pStars">⭐ 0</div>
  </div>
</div>
<div class="fact" id="fact"></div>

<div class="card" id="start"><div class="box">
  <div class="big">🚀</div>
  <h2>טסים בין כוכבים!</h2>
  <p>👆 גע במסך כדי להזיז את החללית</p>
  <p>⭐ אסוף כוכבים</p>
  <p>🪐 טוס לכל כוכב לכת ותגלה עליו משהו מדהים</p>
  <p>☄️ היזהר מהאסטרואידים!</p>
  <button id="go">המראה! 🚀</button>
</div></div>

<div class="card hide" id="planetCard"><div class="box">
  <div class="big" id="pcIcon">🪐</div>
  <h2 id="pcName"></h2>
  <p id="pcFact"></p>
  <button id="pcGo">ממשיכים לטוס! 🚀</button>
</div></div>

<div class="card hide" id="winCard"><div class="box">
  <div class="big">🏆</div>
  <h2>ביקרת בכל מערכת השמש!</h2>
  <p id="winP"></p>
  <button id="again">עוד מסע! 🚀</button>
</div></div>
<div class="ver">גרסה 0.1</div>

<script>
const cv=document.getElementById("c"),cx=cv.getContext("2d");
let W,H,DPR=Math.min(2,window.devicePixelRatio||1);
function size(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",size);size();
const PLANETS=[
 {n:"כוכב חמה",c:"#b8a89a",r:18,f:"הכוכב הכי קרוב לשמש! שנה שלמה שם נמשכת רק 88 ימים."},
 {n:"נוגה",c:"#e8c27a",r:24,f:"הכוכב הכי חם במערכת השמש, חם יותר מתנור!"},
 {n:"כדור הארץ",c:"#4fa3ff",r:25,f:"הבית שלנו! הכוכב היחיד שאנחנו יודעים שיש בו חיים 🌍"},
 {n:"מאדים",c:"#e0603f",r:21,f:"הכוכב האדום! יש עליו הר געש ענק, פי 3 מהאוורסט."},
 {n:"צדק",c:"#d9a77a",r:44,f:"הכוכב הכי גדול! יש בו סערה ענקית שגדולה יותר מכדור הארץ."},
 {n:"שבתאי",c:"#e9d08a",r:38,ring:1,f:"יש לו טבעות יפות מקרח ואבנים 💍"},
 {n:"אורנוס",c:"#8fe3e8",r:30,f:"הוא מסתובב על הצד, כמו כדור שמתגלגל!"},
 {n:"נפטון",c:"#4a6bff",r:29,f:"יש בו את הרוחות הכי חזקות במערכת השמש 💨"}
];
let stars=[],ship,items=[],rocks=[],visited,starCount,state="start",target=null,t=0,next=0,shake=0,inv=0;
for(let i=0;i<160;i++)stars.push({x:Math.random(),y:Math.random(),z:Math.random()*0.8+0.2});
function reset(){ship={x:W/2,y:H*0.75,vx:0,vy:0};items=[];rocks=[];visited=0;starCount=0;next=0;upd()}
function upd(){document.getElementById("pPlanets").textContent="🪐 "+visited+"/8";document.getElementById("pStars").textContent="⭐ "+starCount}
reset();
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,d,type="sine",v=.12){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.stop(a.currentTime+d)}
function point(e){return{x:e.clientX,y:e.clientY}}
cv.addEventListener("pointerdown",e=>{target=point(e);ac()});
cv.addEventListener("pointermove",e=>{if(target)target=point(e)});
addEventListener("pointerup",()=>target=null);
const show=id=>document.getElementById(id).classList.remove("hide"),hide=id=>document.getElementById(id).classList.add("hide");
document.getElementById("go").onclick=()=>{hide("start");state="fly";ac();tone(440,.2);tone(660,.3)};
document.getElementById("pcGo").onclick=()=>{hide("planetCard");if(visited>=8){document.getElementById("winP").textContent="אספת "+starCount+" כוכבים בדרך ⭐ אתה אסטרונאוט אמיתי!";show("winCard");state="win"}else state="fly"};
document.getElementById("again").onclick=()=>{hide("winCard");reset();state="fly"};
let factT=0;function fact(s){const f=document.getElementById("fact");f.textContent=s;f.classList.add("show");clearTimeout(factT);factT=setTimeout(()=>f.classList.remove("show"),2200)}
function spawn(){
  if(Math.random()<0.05)items.push({k:"star",x:30+Math.random()*(W-60),y:-20,v:1.6+Math.random()});
  if(Math.random()<0.012+visited*0.002)rocks.push({x:30+Math.random()*(W-60),y:-30,v:1.4+Math.random()*1.2+visited*0.15,r:12+Math.random()*12,a:Math.random()*6});
  next-=1;if(next<=0&&!items.some(i=>i.k==="planet")&&visited<8){const p=PLANETS[visited];items.push({k:"planet",p,x:60+Math.random()*(W-120),y:-60,v:1.1});next=420}
}
function drawShip(){
  const s=ship;cx.save();cx.translate(s.x,s.y);cx.rotate(Math.max(-.4,Math.min(.4,s.vx*0.05)));
  if(state==="fly"){cx.fillStyle="#ff9d2e";cx.beginPath();cx.moveTo(-9,22);cx.lineTo(0,34+Math.random()*12);cx.lineTo(9,22);cx.fill();cx.fillStyle="#ffe066";cx.beginPath();cx.moveTo(-5,22);cx.lineTo(0,29+Math.random()*6);cx.lineTo(5,22);cx.fill()}
  cx.fillStyle="#e9ecff";cx.beginPath();cx.moveTo(0,-30);cx.quadraticCurveTo(16,-10,13,22);cx.lineTo(-13,22);cx.quadraticCurveTo(-16,-10,0,-30);cx.fill();
  cx.fillStyle="#ff4d6d";cx.beginPath();cx.moveTo(-13,8);cx.lineTo(-24,26);cx.lineTo(-11,22);cx.fill();cx.beginPath();cx.moveTo(13,8);cx.lineTo(24,26);cx.lineTo(11,22);cx.fill();
  cx.fillStyle="#5ee7ff";cx.beginPath();cx.arc(0,-6,7,0,7);cx.fill();cx.strokeStyle="#2a2f6b";cx.lineWidth=2;cx.stroke();
  if(inv>0&&Math.floor(inv/6)%2===0){cx.globalAlpha=.4}
  cx.restore();
}
function drawPlanet(o){const p=o.p;
  const g=cx.createRadialGradient(o.x-p.r*.4,o.y-p.r*.4,p.r*.2,o.x,o.y,p.r);g.addColorStop(0,"#ffffffaa");g.addColorStop(.25,p.c);g.addColorStop(1,"#00000088");
  if(p.ring){cx.strokeStyle="#f3e2a8";cx.lineWidth=5;cx.beginPath();cx.ellipse(o.x,o.y,p.r*1.8,p.r*.5,-.3,0,7);cx.stroke()}
  cx.fillStyle=g;cx.beginPath();cx.arc(o.x,o.y,p.r,0,7);cx.fill();
  cx.fillStyle="#fff";cx.font="700 14px Rubik";cx.textAlign="center";cx.fillText(p.n,o.x,o.y+p.r+18);
  cx.strokeStyle="#5ee7ff66";cx.lineWidth=2;cx.setLineDash([4,6]);cx.beginPath();cx.arc(o.x,o.y,p.r+10+Math.sin(t/10)*3,0,7);cx.stroke();cx.setLineDash([]);
}
function drawStarItem(o){cx.save();cx.translate(o.x,o.y);cx.rotate(t/30);cx.fillStyle="#ffd23f";cx.beginPath();for(let i=0;i<10;i++){const r=i%2?5:12,a=i*Math.PI/5;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.fill();cx.restore()}
function drawRock(o){cx.save();cx.translate(o.x,o.y);cx.rotate(o.a+=0.02);cx.fillStyle="#8a7a6e";cx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=o.r*(0.8+((i*37)%5)/20);cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.fill();cx.fillStyle="#6d5f55";cx.beginPath();cx.arc(-o.r*.3,-o.r*.2,o.r*.25,0,7);cx.fill();cx.restore()}
function loop(){
  t++;cx.save();if(shake>0){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=0.85}
  cx.fillStyle="#05061a";cx.fillRect(-20,-20,W+40,H+40);
  for(const s of stars){s.y+=s.z*(state==="fly"?2.2:0.4)/H*3;if(s.y>1)s.y-=1;cx.fillStyle="rgba(255,255,255,"+s.z+")";cx.fillRect(s.x*W,s.y*H,s.z*2.2,s.z*2.2)}
  if(state==="fly"){
    spawn();
    if(target){ship.vx+=(target.x-ship.x)*0.012;ship.vy+=(target.y-ship.y)*0.012}
    ship.vx*=0.86;ship.vy*=0.86;ship.x=Math.max(24,Math.min(W-24,ship.x+ship.vx));ship.y=Math.max(70,Math.min(H-40,ship.y+ship.vy));
    if(inv>0)inv--;
    for(const o of items){o.y+=o.v;
      const d=Math.hypot(o.x-ship.x,o.y-ship.y);
      if(o.k==="star"&&d<26){o.dead=1;starCount++;upd();tone(880+Math.random()*300,.12)}
      if(o.k==="planet"&&d<o.p.r+22){o.dead=1;visited++;upd();tone(523,.15);setTimeout(()=>tone(659,.15),120);setTimeout(()=>tone(784,.3),240);
        document.getElementById("pcName").textContent="הגעת ל"+o.p.n+"!";document.getElementById("pcFact").textContent=o.p.f;
        document.getElementById("pcIcon").textContent=o.p.ring?"🪐":"🌑";show("planetCard");state="planet"}
      if(o.y>H+80){o.dead=1;if(o.k==="planet")next=60}}
    items=items.filter(o=>!o.dead);
    for(const r of rocks){r.y+=r.v;if(inv<=0&&Math.hypot(r.x-ship.x,r.y-ship.y)<r.r+16){r.dead=1;shake=14;inv=90;starCount=Math.max(0,starCount-3);upd();tone(140,.3,"sawtooth",.15);fact("אוי, אסטרואיד! ☄️ איבדת 3 כוכבים");if(navigator.vibrate)navigator.vibrate(120)}if(r.y>H+40)r.dead=1}
    rocks=rocks.filter(r=>!r.dead);
  }
  for(const o of items){if(o.k==="planet")drawPlanet(o);else drawStarItem(o)}
  for(const r of rocks)drawRock(r);
  drawShip();cx.restore();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
