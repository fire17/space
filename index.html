<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070820">
<title>חללית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070820;--panel:#161a3d;--line:#2c3270;--ink:#f2f3ff;--muted:#9da3d6;--blue:#5ee7ff;--pink:#ff6ec7;--gold:#ffd23f;--green:#4ade80;--red:#f43f5e;--purple:#8b7bff}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
  body{background:radial-gradient(ellipse at 50% 0%,#1a1f55 0%,var(--bg) 60%)}
  .app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:10px 12px;max-width:1200px;margin:0 auto}

  /* ---- header ---- */
  header{display:flex;justify-content:space-between;align-items:center;gap:8px}
  h1{font-size:21px;font-weight:900;white-space:nowrap}
  h1 span{color:var(--blue);text-shadow:0 0 14px #5ee7ff88}
  h1 small{font-size:11px;font-weight:500;color:var(--muted);margin-inline-start:8px}
  .hdrEnd{display:flex;gap:8px;align-items:center}
  .cup{font-size:22px;display:none}
  .cup.show{display:block}
  .mute{width:42px;height:42px;font-size:18px;padding:0;justify-content:center}

  /* ---- main: gauges + game + wheel + pedals ---- */
  .main{direction:ltr;display:grid;gap:10px;min-height:0;
    grid-template-columns:minmax(150px,22%) minmax(0,1fr) minmax(110px,16%);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"g game p" "w game p"}
  .gauges{grid-area:g}.wheelWrap{grid-area:w}.pedalsCard{grid-area:p}.game{grid-area:game}
  .card{background:linear-gradient(180deg,#1c2150,#12153a);border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:inset 0 1px 0 #ffffff14,0 10px 30px #0008;min-height:0;min-width:0}
  .gauges{display:flex;flex-direction:column;align-items:center;gap:7px}
  .speed{font-size:46px;font-weight:900;line-height:1;color:var(--blue);text-shadow:0 0 24px #5ee7ff77;font-variant-numeric:tabular-nums}
  .unit{font-size:12px;color:var(--muted);margin-top:-3px;white-space:nowrap}
  .bar{width:100%;height:10px;border-radius:8px;background:#080a22;overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));transition:width .1s}
  .nav{direction:rtl;font-size:13px;font-weight:700;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .lights{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .ind{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:#080a22;border:1px solid var(--line);opacity:.35;transition:all .15s}
  .ind.on{opacity:1;box-shadow:0 0 16px currentColor;border-color:currentColor}
  .ind.c{color:var(--blue)} .ind.y{color:var(--gold)} .ind.g{color:var(--green)} .ind.p{color:var(--pink)}

  .wheelWrap{position:relative;min-height:0;min-width:0}
  .wheel{--ws:200px;position:absolute;left:50%;top:50%;width:var(--ws);height:var(--ws);border-radius:50%;border:calc(var(--ws)*.07) solid #2f3680;background:radial-gradient(circle,#20255a 0 22%,transparent 23%);box-shadow:0 0 24px #5ee7ff44,0 12px 40px #000a,inset 0 0 0 2px #5ee7ff55;cursor:grab;touch-action:none;transform:translate(-50%,-50%)}
  .wheel::before,.wheel::after{content:"";position:absolute;background:#2f3680;border-radius:8px}
  .wheel::before{left:50%;top:50%;width:84%;height:calc(var(--ws)*.06);transform:translate(-50%,-50%)}
  .wheel::after{left:50%;top:50%;width:calc(var(--ws)*.06);height:42%;transform:translate(-50%,0)}
  .wheel i{position:absolute;width:calc(var(--ws)*.07);height:calc(var(--ws)*.07);border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);left:50%;top:calc(var(--ws)*-.07);transform:translateX(-50%)}
  .hornBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3c4596,#20255a);border:2px solid #5ee7ff55;z-index:2;display:grid;place-items:center;font-size:calc(var(--ws)*.12);cursor:pointer}
  .hornBtn.down{background:radial-gradient(circle at 40% 35%,#5a66c8,#2a3080)}

  .pedalsCard{display:flex}
  .pedals{display:flex;gap:10px;justify-content:center;align-items:flex-end;width:100%;height:100%;min-height:0}
  .pedal{flex:1;max-width:120px;border-radius:18px;border:none;color:#10122e;font-weight:900;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 4px;box-shadow:0 8px 0 #0009,0 14px 24px #0008;transition:transform .06s,box-shadow .06s;touch-action:none;cursor:pointer;min-height:0;white-space:nowrap}
  .pedal.brake{height:min(76%,190px);background:linear-gradient(180deg,#ff8fa0,var(--red))}
  .pedal.gas{height:min(96%,240px);background:linear-gradient(180deg,#ffe58a,#ff9d2e)}
  .pedal.down{transform:translateY(6px);box-shadow:0 2px 0 #0009,0 6px 12px #0008}
  .pedal .ic{font-size:28px;margin-bottom:4px}

  /* ---- game view ---- */
  .game{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#050618;box-shadow:0 0 30px #5ee7ff22,0 10px 30px #0008;min-height:0;min-width:0;touch-action:none}
  .game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:absolute;top:8px;left:8px;right:8px;direction:rtl;display:flex;gap:6px;justify-content:flex-start;align-items:center;pointer-events:none;flex-wrap:wrap}
  .hud span{background:#070820cc;border:1px solid #ffffff26;border-radius:12px;padding:4px 9px;font-size:15px;font-weight:700;white-space:nowrap}
  .hud .cr{color:var(--blue)}
  .toast{position:absolute;left:50%;top:48px;transform:translate(-50%,-10px);direction:rtl;background:#070820e6;border:2px solid var(--gold);border-radius:16px;padding:8px 14px;font-size:17px;font-weight:900;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;display:flex;align-items:center;gap:10px;z-index:3;max-width:94%}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast img{width:64px;height:44px;object-fit:cover;border:3px solid #fff;border-radius:4px;transform:rotate(-5deg);box-shadow:0 4px 10px #0008}
  .hint{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);direction:rtl;background:#070820dd;border:2px solid var(--blue);border-radius:16px;padding:9px 16px;font-size:18px;font-weight:900;white-space:nowrap;pointer-events:none;transition:opacity .3s;box-shadow:0 0 24px #5ee7ff44}
  .hint.hide{opacity:0}
  .gbtn{position:absolute;font-family:inherit;font-weight:900;border:none;cursor:pointer;touch-action:none;z-index:2}
  .landBtn{left:50%;bottom:14px;transform:translateX(-50%);direction:rtl;font-size:21px;padding:10px 22px;border-radius:18px;background:linear-gradient(135deg,var(--green),#22c55e);color:#06210f;box-shadow:0 6px 0 #0008,0 0 30px #4ade8088;animation:pulse 1s infinite;flex-direction:row;gap:8px;white-space:nowrap}
  @keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07)}}
  .backBtn{top:44px;left:8px;direction:rtl;font-size:14px;padding:6px 12px;border-radius:12px;background:#070820dd;color:var(--ink);border:1px solid var(--blue);flex-direction:row;gap:4px}
  .crewBar{position:absolute;top:44px;right:8px;display:flex;gap:6px;direction:rtl;z-index:2}
  .crewBar button{flex-direction:row;gap:4px;padding:5px 9px;font-size:13px;background:#070820dd;border-radius:12px}
  .crewBar button .ic{font-size:18px}
  .crewBar button.on{background:#2a3080;border-color:var(--gold);box-shadow:0 0 12px #ffd23f77}
  .pad{position:absolute;left:8px;right:8px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;direction:ltr;z-index:2}
  .pad>div{display:flex;gap:8px;pointer-events:auto}
  .pad button{width:58px;height:58px;border-radius:50%;padding:0;justify-content:center;font-size:26px;background:#070820bb;border:2px solid #ffffff44;touch-action:none}
  .pad button.down{background:#2a3080;border-color:var(--blue)}
  .pad .use{width:auto;border-radius:18px;padding:0 14px;font-size:16px;flex-direction:row;gap:6px;background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#2a1600;border:none;direction:rtl;white-space:nowrap;animation:wob 1s infinite}
  @keyframes wob{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .over{position:absolute;inset:0;display:none;place-items:center;background:#05061899;padding:10px;z-index:4}
  .over.show{display:grid}
  .overCard{direction:rtl;text-align:center;background:linear-gradient(180deg,#1c2150,#12153a);border:2px solid var(--blue);border-radius:22px;padding:14px 18px;box-shadow:0 0 40px #5ee7ff44;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:min(100%,460px);max-height:100%;overflow:auto;animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
  .overCard .big{font-size:44px;line-height:1}
  .overCard h2{font-size:24px;font-weight:900}
  .overCard p{font-size:17px;line-height:1.5;color:#e2e5ff}
  .howto{display:flex;flex-direction:column;gap:4px;font-size:16px;text-align:start}
  .howto b{color:var(--blue)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:15px;color:var(--muted)}
  .stats b{color:var(--ink)}
  .gems{font-size:28px;letter-spacing:4px}
  .again{flex-direction:row;font-size:20px;font-weight:900;padding:10px 22px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#07081f;border:none;box-shadow:0 6px 0 #0008}
  .again.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-size:16px;padding:10px 14px}
  .cardBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2px}
  .overCard.trophy{border-color:var(--gold);box-shadow:0 0 60px #ffd23f66}
  .overCard.trophy .big{font-size:90px;animation:bounce 1.2s infinite}
  .overCard.trophy h2{font-size:30px;color:var(--gold)}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
  [hidden]{display:none!important}

  /* ---- spaceship buttons ---- */
  .controls{direction:ltr;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px}
  button{font-family:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px 3px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;overflow:hidden}
  button .ic{font-size:22px;line-height:1}
  .controls button{min-width:0;line-height:1.1;text-align:center}
  .controls button .lb{white-space:nowrap}
  .controls button.on{background:#25307a;border-color:var(--blue);box-shadow:0 0 14px #5ee7ff66}
  .controls button.fire{animation:fire .3s}
  @keyframes fire{0%{transform:scale(.9);background:#3a46b0}100%{transform:scale(1)}}
  .controls button.cool{opacity:.6}
  .controls button.off{opacity:.35}
  .controls button::after{content:"";position:absolute;left:6px;bottom:3px;height:4px;border-radius:3px;background:var(--gold);width:calc((100% - 12px) * var(--cd,0))}
  .controls #bInside{background:linear-gradient(180deg,#3a2a7a,#25205a);border-color:var(--purple)}

  /* phone / tablet portrait: game on top, dashboard row below */
  @media (orientation:portrait){
    .main{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1.05fr);
      grid-template-rows:minmax(0,1fr) clamp(140px,24vh,250px);
      grid-template-areas:"game game game" "g w p"}
    .gauges{justify-content:center;gap:5px;padding:10px 6px}
    .lights{gap:3px;flex-wrap:nowrap}
    .ind{width:23px;height:23px;font-size:12px;border-radius:7px}
    .speed{font-size:34px}
    .unit{font-size:10px}
    .nav{font-size:11px}
    .pedalsCard{padding:10px 8px}
    .pedals{gap:8px}
    .pedal{font-size:14px;border-radius:14px}
    .pedal .ic{font-size:22px}
    .controls{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
    .controls button{font-size:11px;padding:6px 2px}
    .controls button .ic{font-size:20px}
  }
  @media (orientation:portrait) and (min-width:600px){
    .ind{width:36px;height:36px;font-size:18px}
    .speed{font-size:48px}
    .pedal{font-size:17px}
    .pedal .ic{font-size:28px}
    .controls button{font-size:13px}
  }
  @media (orientation:portrait) and (max-width:380px){
    .controls button{font-size:10px}
    .crewBar button .nm{display:none}
  }
  /* short landscape (phone on its side) */
  @media (orientation:landscape) and (max-height:500px){
    .app{gap:6px;padding:6px 10px}
    h1{font-size:16px}
    .mute{width:32px;height:32px;font-size:15px;border-radius:10px}
    .main{gap:6px;grid-template-columns:minmax(130px,20%) minmax(0,1fr) minmax(100px,15%)}
    .card{padding:8px;border-radius:16px}
    .gauges{gap:3px}
    .ind{width:24px;height:24px;font-size:12px;border-radius:8px}
    .speed{font-size:28px}
    .unit,.nav{font-size:10px}
    .bar{height:7px}
    .controls{gap:5px}
    .controls button{padding:4px 2px;font-size:10px;gap:2px}
    .controls button .ic{font-size:16px}
    .hud span{font-size:12px;padding:2px 7px}
    .hint{font-size:14px;padding:7px 12px}
    .toast{font-size:14px;top:34px}
    .backBtn,.crewBar{top:34px}
    .pad button{width:46px;height:46px;font-size:20px}
    .landBtn{font-size:16px;padding:7px 16px}
    .overCard{padding:8px 14px;gap:4px}
    .overCard .big{font-size:26px}
    .overCard p{font-size:13px}
    .howto{font-size:12px;gap:1px}
    .overCard.trophy .big{font-size:56px}
    .overCard h2{font-size:19px}
    .again{font-size:16px;padding:7px 16px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🚀 <span>חללית</span><small>גרסה 0.2</small></h1>
    <div class="hdrEnd">
      <div class="cup" id="cup" title="גביע">🏆</div>
      <button class="mute" id="mute" title="צלילים">🔊</button>
    </div>
  </header>

  <div class="main">
    <div class="card gauges">
      <div class="lights">
        <div class="ind c" id="iShield">🛡️</div>
        <div class="ind y" id="iLights">💡</div>
        <div class="ind g" id="iGear">🛬</div>
        <div class="ind p" id="iRadar">📡</div>
      </div>
      <div class="speed" id="speed">0</div>
      <div class="unit" id="unit">מהירות</div>
      <div class="bar"><i id="pow"></i></div>
      <div class="nav" id="nav">📡</div>
    </div>

    <div class="game" id="game">
      <canvas id="cv"></canvas>
      <div class="hud">
        <span id="hPl">🪐 0/8</span>
        <span id="hSt">⭐ 0</span>
        <span id="hCo">🪙 0</span>
        <span class="cr" id="hCr" hidden>💎 0/3</span>
      </div>
      <div class="toast" id="toast"></div>
      <div class="hint hide" id="hint"></div>
      <button class="gbtn backBtn" id="backBtn" hidden>🚀 לחללית</button>
      <div class="crewBar" id="crewBar" hidden>
        <button data-c="0"><span class="ic">👨‍🚀</span><span class="nm">אסטרונאוט</span></button>
        <button data-c="1"><span class="ic">🧑‍✈️</span><span class="nm">טייס</span></button>
        <button data-c="2"><span class="ic">🤖</span><span class="nm">רובוט</span></button>
      </div>
      <button class="gbtn landBtn" id="landBtn" hidden>🛬 נחיתה!</button>
      <div class="pad" id="pad" hidden>
        <div><button id="padL">⬅️</button><button id="padR">➡️</button></div>
        <div><button class="use" id="useBtn" hidden>✋</button><button id="padJ">⬆️</button></div>
      </div>
      <div class="over show" id="over"><div class="overCard" id="card"></div></div>
    </div>

    <div class="wheelWrap" id="wheelWrap">
      <div class="wheel" id="wheel"><i></i><div class="hornBtn" id="horn">📢</div></div>
    </div>

    <div class="card pedalsCard">
      <div class="pedals">
        <div class="pedal brake" id="brake"><span class="ic" id="brakeIc">🛑</span><span id="brakeLb">ברקס</span></div>
        <div class="pedal gas" id="gas"><span class="ic" id="gasIc">🔥</span><span id="gasLb">גז</span></div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button id="bTurbo"><span class="ic">🚀</span><span class="lb">טורבו</span></button>
    <button id="bShield"><span class="ic">🛡️</span><span class="lb">מגן</span></button>
    <button id="bLaser"><span class="ic">🔫</span><span class="lb">לייזר</span></button>
    <button id="bLights"><span class="ic">💡</span><span class="lb">פנסים</span></button>
    <button id="bGear"><span class="ic">🛬</span><span class="lb">מנחת</span></button>
    <button id="bRadar"><span class="ic">📡</span><span class="lb">רדאר</span></button>
    <button id="bHyper"><span class="ic">✨</span><span class="lb">היפר-חלל</span></button>
    <button id="bMusic"><span class="ic">🎵</span><span class="lb">מוזיקה</span></button>
    <button id="bHorn"><span class="ic">📢</span><span class="lb">צופר חללי</span></button>
    <button id="bCam"><span class="ic">📸</span><span class="lb">מצלמה</span></button>
    <button id="bInside"><span class="ic">👨‍🚀</span><span class="lb" id="insideLb">פנים החללית</span></button>
    <button id="bHelp"><span class="ic">❓</span><span class="lb">עזרה</span></button>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const TAU = Math.PI * 2;

/* ================= Sound ================= */
let AC = null, master = null, muted = false, engine = null;
function ac() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === "suspended") AC.resume().catch(() => {});
  return AC;
}
function beep(freq, dur, type = "square", vol = 0.15, slideTo = 0) {
  const a = ac();
  if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
const later = (ms, fn) => setTimeout(fn, ms);
const tune = (notes, gap, type, vol) => notes.forEach((f, i) => later(i * gap, () => beep(f, gap / 1000 * 1.6, type, vol)));
const sfx = {
  click()   { beep(1200, .04, "sine", .1); },
  on()      { beep(700, .06, "sine", .12, 1100); },
  off()     { beep(900, .06, "sine", .1, 500); },
  star()    { beep(1046 + Math.random() * 300, .1, "triangle", .1); },
  coin()    { beep(988, .07, "square", .06); later(65, () => beep(1319, .16, "square", .06)); },
  bump()    { beep(320, .35, "sine", .3, 90); beep(180, .25, "triangle", .18, 70); },
  boing()   { beep(220, .3, "sine", .22, 520); },
  laser()   { beep(1500, .16, "square", .05, 350); },
  sparkle() { tune([1319, 1568, 2093, 2637], 45, "triangle", .07); },
  turbo()   { beep(160, .7, "sawtooth", .09, 900); },
  shield()  { beep(400, .45, "sine", .16, 1200); },
  pop()     { beep(1000, .3, "triangle", .16, 200); },

function updateFly(dt) {
  const live = !G.paused;
  const gas = live && (gasTouch || gasKey), brake = live && (brakeTouch || brakeKey);
  if (!wheelDrag) {
    if (keySteer && live) steer += (keySteer * 1.6 - steer) * Math.min(1, dt * 10);
    else steer *= Math.pow(0.9, dt * 60);
  }
  if (live) {
    ship.a += steer * 0.95 * dt;
    const [hx, hy] = heading();
    if (turboT > 0) turboT -= dt;
    const turbo = turboT > 0;
    const acc = gas ? (turbo ? 640 : 290) : (turbo ? 420 : 0);
    ship.vx += hx * acc * dt; ship.vy += hy * acc * dt;
    let sp = Math.hypot(ship.vx, ship.vy);
    if (sp > 1) {                          // velocity follows the nose, so it feels like driving
      const k = Math.min(1, dt * 1.6);
      ship.vx += (hx * sp - ship.vx) * k; ship.vy += (hy * sp - ship.vy) * k;
    }
    const drag = Math.exp(-0.35 * dt);
    ship.vx *= drag; ship.vy *= drag;
    sp = Math.hypot(ship.vx, ship.vy);
    if (brake && sp > 0) { const ns = Math.max(0, sp - 430 * dt); ship.vx *= ns / sp; ship.vy *= ns / sp; sp = ns; }
    const max = turbo ? 720 : (gearDown ? 240 : 400);
    if (sp > max) { const ns = Math.max(max, sp - 500 * dt); ship.vx *= ns / sp; ship.vy *= ns / sp; }
    ship.thrust += ((gas || turbo ? 1 : 0) - ship.thrust) * Math.min(1, dt * 8);
    if (hyperT > 0) {
      const before = hyperT;
      hyperT -= dt;
      if (before > 0.6 && hyperT <= 0.6) {           // the jump itself
        ship.x = wrap(ship.x + hx * 1700); ship.y = wrap(ship.y + hy * 1700);
        cam.x = ship.x; cam.y = ship.y;
        ship.vx = hx * 300; ship.vy = hy * 300;
        G.flash = 0.7; items = items.filter(o => distShip(o) < 1600);
      }
    }
    ship.x = wrap(ship.x + ship.vx * dt); ship.y = wrap(ship.y + ship.vy * dt);
    if (ship.inv > 0) ship.inv -= dt;

  items = items.filter(o => !o.dead && distShip(o) < 1700);
  rocks = rocks.filter(o => !o.dead && distShip(o) < 1800);
  friends = friends.filter(o => distShip(o) < 1900);
  if (items.length < 16) spawnItem();
  if (rocks.length < 3 && Math.random() < dt * 0.5) spawnRock();
  if (friends.length < 10 && Math.random() < dt * 1.2) spawnFriends();

  for (const o of items) {
    o.ph += dt * 3;
    if (live && distShip(o) < 46) {
      o.dead = true;
      if (o.k === "star") { G.stars++; sfx.star(); floatText(o.x, o.y, "+1 ⭐"); }
      else { G.coins++; sfx.coin(); floatText(o.x, o.y, "+1 🪙"); }
    }
  }
  for (const r of rocks) {
    r.x = wrap(r.x + r.vx * dt); r.y = wrap(r.y + r.vy * dt); r.rot += r.vr * dt;
    if (!live || ship.inv > 0 || hyperT > 0) continue;
    const dx = wd(r.x - ship.x), dy = wd(r.y - ship.y), d = Math.hypot(dx, dy);
    if (d < r.r + 30) {
      r.dead = true;
      if (shieldOn) {
        shieldOn = false; CD.shield = CDLEN.shield; sfx.pop();
        burst(r.x, r.y, 22, ["#5ee7ff", "#a5f3fc", "#ffffff"]);
        toast("המגן שמר עליך! 🛡️");
      } else {
        const lost = Math.min(3, G.stars);
        G.stars -= lost; G.shake = 0.5; ship.inv = 2;
        ship.vx -= dx / d * 160; ship.vy -= dy / d * 160;
        burst(r.x, r.y, 16, ["#a8998c", "#7d6f63", "#d6c9bd"]);
        sfx.bump(); vibrate(120);
        toast(lost ? `אוי, אסטרואיד! ☄️ -${lost} ⭐` : "אוי, אסטרואיד! ☄️");
      }
    }
  }
  for (const f of friends) {
    if (f.leader && friends.includes(f.leader)) {
      const L = f.leader, h = Math.atan2(L.vy, L.vx);
      const gx = L.x - Math.cos(h) * f.off.back - Math.sin(h) * f.off.side;
      const gy = L.y - Math.sin(h) * f.off.back + Math.cos(h) * f.off.side;
      f.vx = L.vx + wd(gx - f.x) * 2; f.vy = L.vy + wd(gy - f.y) * 2;
    } else if (f.leader) f.leader = null;

    if (d < 200 && !f.leader) {          // politely steer away from us

    }
    f.x = wrap(f.x + f.vx * dt); f.y = wrap(f.y + f.vy * dt);
    f.ph += dt;
    if (f.wave > 0) f.wave -= dt;
    if (d < 330 && !f.said && Math.random() < dt * 1.5) { f.said = true; f.wave = 2.5; f.say = { t: pick(["👋", "👋 היי!", "😊", "👽 שלום!"]), life: 1.8 }; }
    if (f.say) { f.say.life -= dt; if (f.say.life <= 0) f.say = null; }
    if (f.bump > 0) f.bump -= dt;
    if (live && d < f.r + 30 && f.bump <= 0 && hyperT <= 0) {    // a soft, bouncy bump
      f.bump = 1.5; G.shake = Math.max(G.shake, 0.25);
      ship.vx -= dx / d * 150; ship.vy -= dy / d * 150;
      f.vx += dx / d * 110; f.vy += dy / d * 110;
      f.say = { t: "אופס! 😅", life: 1.6 };
      sfx.boing(); vibrate(40);
    }
  }
  for (const b of bolts) {
    b.x = wrap(b.x + b.vx * dt); b.y = wrap(b.y + b.vy * dt); b.life -= dt;
    for (const r of rocks) {
      if (!r.dead && Math.hypot(wd(r.x - b.x), wd(r.y - b.y)) < r.r + 8) {
        r.dead = true; b.life = 0;
        burst(r.x, r.y, 26, ["#ffd23f", "#ff6ec7", "#5ee7ff", "#4ade80", "#ffffff"], 220);
        items.push({ k: "star", x: r.x, y: r.y, ph: 0 });
        sfx.sparkle();
        floatText(r.x, r.y - 20, "✨ פוף!", "#ff6ec7");
      }
    }
  }
  bolts = bolts.filter(b => b.life > 0);

  // planets: who is near, where is the next one
  nearPlanet = null; target = null;
  let best = 1e9, bestT = 1e9;
  for (const p of PLANETS) {
    const d = distShip(p);
    if (d < p.R + 150 && d < best) { best = d; nearPlanet = p; }
    const todo = !progress.visited.includes(p.i);
    const score = d + (todo ? 0 : 1e6);
    if (score < bestT) { bestT = score; target = p; }
  }
  const sp = Math.hypot(ship.vx, ship.vy);
  canLand = live && !!nearPlanet && gearDown && sp < 80;
  const lb = $("landBtn");
  if (canLand) { lb.hidden = false; const t = "🛬 נחיתה על " + nearPlanet.n; if (lb.textContent !== t) lb.textContent = t; }
  else lb.hidden = true;
  if (!live) setHint("");
  else if (nearPlanet && !gearDown) setHint("לחץ על מנחת 🛬");
  else if (nearPlanet && sp >= 80) setHint("האט עם הברקס 🛑");
  else if (G.idle > 1.5) setHint("לחץ על גז 🔥");
  else setHint("");
}
$("landBtn").onclick = () => { $("landBtn").blur(); land(); };

/* ================= Landing + walking on a planet ================= */
let WK = null;
function land() {
  if (!canLand || !nearPlanet) return;
  startWalk(nearPlanet.i);
}
function startWalk(i) {
  const p = PLANETS[i], s = clamp(H / 430, 0.6, 1.3);
  const L = Math.max(W * 2.4, 1300 * s);
  WK = {
    p, s, L, camX: 0, got: 0, done: 0, t: 0, say: null,
    a: { x: 190 * s, h: 0, vy: 0, vx: 0, face: 1, onG: true, ph: 0 },
    plats: [{ x: L * 0.46, w: 160 * s, h: 85 * s }, { x: L * 0.7, w: 140 * s, h: 110 * s }],
    gems: [],

    craters: Array.from({ length: 10 }, () => ({ x: rand(0, L), w: rand(40, 110) * s }))

    { x: L * 0.3, h: 34 * s, c: "#5ee7ff" },
    { x: L * 0.46 + 80 * s, h: 85 * s + 34 * s, c: "#ff6ec7" },

function walkDir() {

}

}
function supportAt(x, h) {
  let sup = 0;
  for (const pl of WK.plats) if (Math.abs(x - (pl.x + pl.w / 2)) < pl.w / 2 + 6 && pl.h <= h + 1) sup = Math.max(sup, pl.h);
  return sup;
}
function updateWalk(dt) {
  if (!wheelDrag) {
    if (keySteer && !G.paused) steer += (keySteer * 1.2 - steer) * Math.min(1, dt * 10);
    else steer *= Math.pow(0.9, dt * 60);

  const dir = w.done ? 0 : walkDir();
  a.vx += (dir * 250 * s - a.vx) * Math.min(1, dt * 10);

  if (!a.onG && a.vy <= 0 && a.h <= sup && prevH >= sup - 1) { a.h = sup; a.vy = 0; a.onG = true; }
  if (a.h < 0) { a.h = 0; a.vy = 0; a.onG = true; }
  for (const gm of w.gems) {
    if (gm.got) continue;
    if (Math.abs(gm.x - a.x) < 38 * s && Math.abs(gm.h - (a.h + 34 * s)) < 52 * s) {
      gm.got = true; w.got++; sfx.gem(); vibrate(40);
      for (let i = 0; i < 20; i++) { const an = rand(0, TAU), v = rand(60, 220); sparks.push({ x: gm.x, h: gm.h, vx: Math.cos(an) * v, vy: Math.sin(an) * v, life: 1, c: pick([gm.c, "#ffffff", "#ffd23f"]) }); }

  w.camX = clamp(a.x - W / 2, 0, Math.max(0, w.L - W));
  setHint(w.t < 2.5 ? "אסוף 3 יהלומים 💎" : "");
}
function finishPlanet() {

  const all = progress.visited.length >= 8;

/* ================= Drawing helpers ================= */

  ctx.arcTo(x + w, y + h, x, y + h, r);

  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

}

}

      const ay = y - 104 * s + Math.sin(t * 6) * 4;
      ctx.fillStyle = "#ffd23f"; ctx.strokeStyle = "#070820"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x - 9, ay - 10); ctx.lineTo(x + 9, ay - 10); ctx.lineTo(x, ay); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (c.say) bubble(c.say.t, x, y - (i === IN.sel ? 120 : 100) * s, 13);
  });
  for (const sn of IN.snacks) {
    const k = Math.min(1, sn.t / .6), x = sn.x + (sn.tx - sn.x) * k, y = sn.y + (sn.ty - sn.y) * k - Math.sin(k * Math.PI) * 60 * s;
    ctx.globalAlpha = sn.t > 1 ? Math.max(0, (1.4 - sn.t) / .4) : 1;
    ctx.font = `${26 * s}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(sn.e, x, y);
    ctx.globalAlpha = 1;
  }
  if (!lights) { ctx.fillStyle = "rgba(5,6,30,.28)"; ctx.fillRect(0, 0, W, H); }
}

function draw() {
  if (G.scene === "walk" && WK) drawWalk();
  else if (G.scene === "inside") drawInside();
  else drawSpace();
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, G.flash)})`; ctx.fillRect(0, 0, W, H); }
}

/* ================= HUD + dashboard ================= */
let lastHud = "";
function updateHud() {
  const sp = Math.hypot(ship.vx, ship.vy);
  const key = [progress.visited.length, G.stars, G.coins, progress.trophy].join("|");
  if (key !== lastHud) {
    lastHud = key;
    $("hPl").textContent = "🪐 " + progress.visited.length + "/8";
    $("hSt").textContent = "⭐ " + G.stars;
    $("hCo").textContent = "🪙 " + G.coins;
    $("cup").classList.toggle("show", progress.trophy);
  }
  const gas = gasTouch || gasKey;
  wh.style.transform = "translate(-50%,-50%) rotate(" + steer + "rad)";
  const fly = G.scene === "fly";
  $("speed").textContent = fly ? Math.round(sp / 4) : 0;
  $("unit").textContent = fly ? "מהירות" : (G.scene === "inside" ? "טייס אוטומטי 🤖" : "חונים 🅿️");
  $("pow").style.width = (fly ? Math.min(100, sp / 7.2 + (gas ? 8 : 0)) : 0) + "%";
  const nav = radar && target ? "📡 " + target.n : "📡 כבוי";
  if ($("nav").textContent !== nav) $("nav").textContent = nav;
  $("iShield").classList.toggle("on", shieldOn); $("iLights").classList.toggle("on", lights);
  $("iGear").classList.toggle("on", gearDown); $("iRadar").classList.toggle("on", radar);
  $("bLights").classList.toggle("on", lights); $("bGear").classList.toggle("on", gearDown);
  $("bRadar").classList.toggle("on", radar); $("bMusic").classList.toggle("on", musicOn);
  $("bShield").classList.toggle("on", shieldOn); $("bTurbo").classList.toggle("on", turboT > 0);
  $("bHyper").classList.toggle("on", hyperT > 0);
  for (const k of ["turbo", "shield", "hyper", "cam"]) {
    const b = $(BTN[k]), f = CD[k] > 0 ? CD[k] / CDLEN[k] : 0;
    b.style.setProperty("--cd", f.toFixed(3));
    b.classList.toggle("cool", f > 0);
  }
  if (engine) {
    const on = fly && !G.paused;
    engine.o.frequency.value = 55 + sp * .12 + (gas ? 25 : 0) + (turboT > 0 ? 40 : 0);
    engine.g.gain.value = muted || !on ? 0 : .012 + (gas ? .025 : 0);
  }
}

/* ================= Main loop ================= */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  G.time += dt;
  for (const k in CD) if (CD[k] > 0) CD[k] = Math.max(0, CD[k] - dt);
  G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt * 1.5);
  for (const pt of parts) { pt.x = wrap(pt.x + pt.vx * dt); pt.y = wrap(pt.y + pt.vy * dt); pt.vx *= .97; pt.vy *= .97; pt.life -= dt; }
  parts = parts.filter(pt => pt.life > 0);
  if (G.scene === "fly") updateFly(dt);
  else if (G.scene === "walk") updateWalk(dt);
  else updateInside(dt);
  G.saveT += dt;
  if (G.saveT > 4 && (G.stars !== progress.stars || G.coins !== progress.coins)) { G.saveT = 0; saveProgress(); }
  draw();
  updateHud();
  requestAnimationFrame(loop);
}
onResize();
setScene("fly");
for (let i = 0; i < 4; i++) spawnFriends();
showCard("start");
requestAnimationFrame(t => { lastT = t; loop(t); });
</script>
